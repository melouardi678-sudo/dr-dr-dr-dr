<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-ACCESS WEB — Gestion de Cabinet Médical</title>
    <meta name="description" content="Logiciel de gestion de cabinet médical professionnel avec dossier patient, agenda, consultations, ordonnances, facturation, stock et licence - E-ACCESS WEB Medical Software Solutions." />
    <meta property="og:title" content="E-ACCESS WEB — Gestion de Cabinet Médical" />
    <meta property="og:description" content="Logiciel de gestion de cabinet médical professionnel avec dossier patient, agenda, consultations, ordonnances, facturation, stock et licence - E-ACCESS WEB Medical Software Solutions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediCab" />
    <style>
      /* Critical styles to completely prevent White Screen of Death (WSOD) in Electron and Browser */
      html, body {
        background-color: #090d16 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #090d16;
      }
      .medicab-preloader {
        position: fixed;
        inset: 0;
        background-color: #090d16;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        color: #f8fafc;
      }
      .medicab-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: medicab-spin 0.8s linear infinite;
      }
      @keyframes medicab-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-hydration loader: Replaced automatically when React mounts, preventing white flash -->
      <div class="medicab-preloader" id="app-preloader">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
          <div class="medicab-spinner"></div>
          <div style="font-weight: 800; font-size: 18px; letter-spacing: -0.5px; color: #ffffff;">
            Medi<span style="color: #34d399;">Cab</span>
          </div>
          <div style="font-size: 12px; color: #94a3b8; font-weight: 500;">
            Initialisation du logiciel médical...
          </div>
        </div>
      </div>
    </div>
    <script>
      // Global error listener to catch any fatal script error and prevent white screen
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        var preloader = document.getElementById('app-preloader');
        if (preloader && root && root.children.length <= 1) {
          preloader.innerHTML = '<div style="padding: 24px; max-width: 420px; background: #0f172a; border: 1px solid #dc2626; border-radius: 16px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);"><h3 style="color: #f87171; margin-top: 0; font-size: 16px;">Erreur de démarrage</h3><p style="color: #94a3b8; font-size: 12px; margin-bottom: 16px;">Une anomalie s\'est produite lors du chargement des composants.</p><button onclick="window.location.reload()" style="padding: 8px 18px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px;">Réessayer</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
